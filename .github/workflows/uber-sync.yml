name: Uber Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (adjust later)

concurrency:
  group: uber-sync
  cancel-in-progress: true

jobs:
  uber-sync:
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore auth
        shell: pwsh
        run: |
          Copy-Item `
            C:\Users\highf\Downloads\hfs\playwright\.auth\user.json `
            playwright\.auth\user.json `
            -Force

      - name: Run Uber Sync
        run: npx tsx uber-sync.ts