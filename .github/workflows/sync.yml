name: Uber Sync

on:
  push:
  workflow_dispatch:

jobs:
  uber-sync:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Restore Uber auth
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force playwright/.auth
          Copy-Item `
            C:\Users\highf\Downloads\hfs\playwright\.auth\user.json `
            playwright\.auth\user.json `
            -Force

      - run: npx tsx uber-sync.ts
